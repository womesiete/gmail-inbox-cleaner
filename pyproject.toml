[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-inbox-cleaner"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Wilson Omesiete"}]
description = "A local, reviewable Gmail inbox cleanup application with a separate offline demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"PyQt6>=6.6,<7",
	"google-api-python-client>=2.100,<3",
	"google-auth>=2.23,<3",
	"google-auth-oauthlib>=1.1,<2",
	"requests>=2.31,<3",
	"keyring>=24,<27",
	"beautifulsoup4>=4.12,<5",
	"tzdata>=2024.1",
	"tzlocal>=5,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pytest-cov>=6,<8", "ruff>=0.9,<1", "build>=1.2,<2", "mypy>=1.14,<2", "pip-audit>=2.8,<3"]
package = ["pyinstaller>=6.6,<7"]

[project.urls]
Repository = "https://github.com/womesiete/gmail-inbox-cleaner"
Issues = "https://github.com/womesiete/gmail-inbox-cleaner/issues"
Changelog = "https://github.com/womesiete/gmail-inbox-cleaner/blob/main/CHANGELOG.md"

[project.scripts]
gmail-clean = "gmail_clean.app:main"

[project.gui-scripts]
gmail-clean-gui = "gmail_clean.app:main"

[tool.setuptools.packages.find]
include = ["gmail_clean*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "BLE", "S", "PERF"]

[tool.ruff.lint.per-file-ignores]
# Pytest assertions, synthetic secrets, fixed subprocess fixtures and seeded fuzz
# generators are intentional in offline tests; production retains these checks.
"tests/*" = ["S101", "S105", "S106", "S311", "S603"]

[tool.ruff.format]
indent-style = "tab"

[tool.coverage.run]
source = ["gmail_clean"]
relative_files = true

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.mypy]
python_version = "3.11"
files = ["gmail_clean"]
exclude = ["gmail_clean/(gui[^/]*|table_model|app)\\.py$"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
