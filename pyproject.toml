[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-inbox-cleaner"
version = "0.1.0"
description = "A local, reviewable Gmail inbox cleanup application with a separate offline demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"PyQt6>=6.6,<7",
	"google-api-python-client>=2.100,<3",
	"google-auth>=2.23,<3",
	"google-auth-oauthlib>=1.1,<2",
	"requests>=2.31,<3",
	"keyring>=24,<27",
	"beautifulsoup4>=4.12,<5",
	"tzdata>=2024.1",
	"tzlocal>=5,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pytest-cov>=6,<8", "ruff>=0.9,<1", "build>=1.2,<2"]
package = ["pyinstaller>=6.6,<7"]

[project.scripts]
gmail-clean = "gmail_clean.app:main"

[project.gui-scripts]
gmail-clean-gui = "gmail_clean.app:main"

[tool.setuptools.packages.find]
include = ["gmail_clean*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
indent-style = "tab"

[tool.coverage.run]
source = ["gmail_clean"]
relative_files = true

[tool.coverage.report]
fail_under = 75
show_missing = true
