name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q gmail_clean scripts
      - name: Lint
        run: python -m ruff check gmail_clean tests scripts
      - name: Test
        run: python -m pytest
      - name: Offline workflow
        run: python -m gmail_clean --demo --headless --count 100
      - name: Package source and wheel
        run: python -m build
