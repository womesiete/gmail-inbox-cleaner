name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Qt native runtime (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Check offscreen Qt startup
        run: python -c "from PyQt6.QtWidgets import QApplication; app = QApplication([]); print('Offscreen Qt startup succeeded')"
      - name: Compile
        run: python -m compileall -q gmail_clean scripts
      - name: Lint
        run: python -m ruff check gmail_clean tests scripts
      - name: Test
        run: python scripts/ci_tests.py
      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-diagnostics-${{ matrix.os }}-${{ matrix.python }}
          path: |
            test-results.xml
            test-output.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Offline workflow
        run: python -m gmail_clean --demo --headless --count 100
      - name: Package source and wheel
        run: python -m build
